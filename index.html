<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#fbe9ef">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22%3E%3Cg fill=%22%23f29bbd%22%3E%3Cellipse cx=%2220%22 cy=%2210%22 rx=%226%22 ry=%228%22/%3E%3Cellipse cx=%2220%22 cy=%2230%22 rx=%226%22 ry=%228%22/%3E%3Cellipse cx=%2210%22 cy=%2220%22 rx=%228%22 ry=%226%22/%3E%3Cellipse cx=%2230%22 cy=%2220%22 rx=%228%22 ry=%226%22/%3E%3C/g%3E%3Ccircle cx=%2220%22 cy=%2220%22 r=%225%22 fill=%22%23ffd76a%22/%3E%3C/svg%3E">
<title>Rachel's To Do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500;1,9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --blush:#f7c8d8;--blush2:#ffe3ec;--rose:#e0789f;--lav:#cdb8f2;--lav2:#ece3ff;--plum:#3b2850;--plum2:#5e4778;
 --mint:#bfe8d4;--mint2:#e2f6ec;--sage:#5f9e80;--cream:#fff9f0;--gold:#e9b949;--gold2:#ffe7a3;--peach:#ffd5bd;--sky:#cfe3ff;
 --ink:#3b2850;--soft:#6e5a84;--line:rgba(126,96,160,.16);
 --card:rgba(255,252,247,.94);--shadow:0 6px 24px rgba(120,80,140,.12),0 1px 3px rgba(120,80,140,.08);
 --f-head:"Fraunces",Georgia,"Times New Roman",serif;--f-body:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
 --garden-h:110px
}
@media (min-width:760px){:root{--garden-h:160px}}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--ink);font:15.5px/1.55 var(--f-body);min-height:100vh;background:var(--cream);overflow-x:hidden}
a{color:#8a4fc7}
button{font:inherit;cursor:pointer;color:inherit}
.hidden{display:none!important}
:focus-visible{outline:3px solid rgba(160,110,220,.55);outline-offset:2px;border-radius:8px}

/* sky */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;
 background:radial-gradient(ellipse 70% 45% at 78% 8%,rgba(255,231,163,.75),transparent 62%),
 radial-gradient(ellipse 60% 50% at 10% 20%,rgba(205,184,242,.55),transparent 65%),
 linear-gradient(180deg,#f3e6ff 0%,#fde4ee 38%,#fff2e6 70%,#fff9f0 100%)}
.sky .sun{position:absolute;right:12%;top:6%;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,244,205,.95),rgba(255,231,163,.4) 55%,transparent 72%);animation:sunpulse 9s ease-in-out infinite}
@keyframes sunpulse{50%{transform:scale(1.08);opacity:.85}}
.cloud{position:absolute;height:26px;border-radius:30px;background:rgba(255,255,255,.7);filter:blur(1px);animation:cloud linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:44%;height:180%;left:16%;top:-90%}.cloud::after{width:34%;height:140%;left:48%;top:-60%}
@keyframes cloud{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}

/* garden */
.garden{position:fixed;left:0;right:0;bottom:0;height:var(--garden-h);z-index:0;pointer-events:none}
.garden svg.hills{position:absolute;inset:0;width:100%;height:100%}
.flower{position:absolute;bottom:0;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.flower .head{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.07)}}

/* ambient */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fairy{position:absolute;left:0;top:0;width:34px;height:34px;will-change:transform}
.fairy .bob{width:100%;height:100%;animation:bob 2.6s ease-in-out infinite}
.fairy svg{width:100%;height:100%;overflow:visible}
.fairy .w{transform-box:view-box;transform-origin:20px 20px;animation:flap .22s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleX(.45)}}
@keyframes bob{50%{transform:translateY(-9px)}}
.f1{animation:fly1 34s ease-in-out infinite}
.f2{animation:fly2 42s ease-in-out infinite;animation-delay:-14s}
.f3{animation:fly3 38s ease-in-out infinite;animation-delay:-25s;width:26px;height:26px}
@keyframes fly1{0%{transform:translate(-8vw,28vh)}20%{transform:translate(18vw,12vh)}40%{transform:translate(42vw,30vh)}60%{transform:translate(66vw,14vh)}80%{transform:translate(88vw,34vh)}100%{transform:translate(110vw,20vh)}}
@keyframes fly2{0%{transform:translate(108vw,62vh) scaleX(-1)}25%{transform:translate(76vw,46vh) scaleX(-1)}50%{transform:translate(50vw,66vh) scaleX(-1)}75%{transform:translate(22vw,48vh) scaleX(-1)}100%{transform:translate(-10vw,58vh) scaleX(-1)}}
@keyframes fly3{0%{transform:translate(30vw,104vh)}25%{transform:translate(12vw,74vh)}50%{transform:translate(34vw,52vh)}75%{transform:translate(70vw,70vh)}100%{transform:translate(96vw,-8vh)}}
.glim{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff3c4;box-shadow:0 0 6px 2px rgba(255,215,106,.75);opacity:0;animation:glim 4s ease-in-out infinite}
.glim.sp{width:9px;height:9px;border-radius:0;background:#fff;box-shadow:none;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
@keyframes glim{0%,100%{opacity:0;transform:translateY(0) scale(.6)}50%{opacity:.95;transform:translateY(-10px) scale(1)}}
.petal{position:absolute;top:-30px;width:14px;height:10px;border-radius:70% 0 70% 0;opacity:.85;animation:fall linear forwards}
.petal i{display:block;width:100%;height:100%;border-radius:inherit;background:inherit;animation:spin 3s ease-in-out infinite alternate}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(420deg)}}
@keyframes spin{from{transform:rotateX(0) translateX(-12px)}to{transform:rotateX(70deg) translateX(12px)}}
body.calm .ambient,body.calm .cloud{display:none}
body.calm .flower,body.calm .flower .head,body.calm .sun,body.calm .shimmer-text{animation:none}
body.paused .ambient *,body.paused .garden *,body.paused .sky *{animation-play-state:paused}

#fx{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}

/* lock */
#lock{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 20px calc(var(--garden-h) + 20px)}
#lock form{position:relative;background:rgba(255,252,247,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.9);border-radius:28px;padding:30px 26px 24px;width:100%;max-width:380px;box-shadow:0 18px 50px rgba(140,90,170,.22);text-align:center}
#lock .crest{width:64px;height:64px;margin:-62px auto 8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffe3ec 60%,#f7c8d8);box-shadow:0 6px 18px rgba(224,120,159,.35),0 0 0 6px rgba(255,255,255,.7);display:grid;place-items:center}
#lock h1{margin:0;font:700 1.75rem/1.2 var(--f-head);color:var(--plum)}
#lock p{margin:6px 0 18px;color:var(--soft)}
#lock input[type=password]{width:100%;padding:13px 16px;border:1.5px solid rgba(160,120,210,.35);border-radius:16px;font:inherit;font-size:1rem;background:#fff;color:var(--ink);text-align:center}
#lock input[type=password]:focus{outline:none;border-color:#b78be6;box-shadow:0 0 0 4px rgba(205,184,242,.45)}
#lock label.rem{display:flex;gap:8px;align-items:center;justify-content:center;margin:12px 0 16px;font-size:.92rem;color:var(--soft)}
#lock label.rem input{accent-color:var(--rose);width:16px;height:16px}
.btn-main{width:100%;padding:13px;border:0;border-radius:16px;background:linear-gradient(120deg,#e98bb0,#b892ec);color:#fff;font-weight:800;font-size:1rem;letter-spacing:.02em;box-shadow:0 8px 20px rgba(200,110,170,.35);transition:transform .15s,box-shadow .15s}
.btn-main:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(200,110,170,.45)}
.btn-main:disabled{opacity:.7}
#lockErr{color:#b8325f;font-size:.92rem;min-height:1.4em;margin-top:10px;font-weight:600}

/* app shell */
#app{position:relative;z-index:2;padding-bottom:calc(var(--garden-h) + 10px)}
header.hero{padding:18px 16px 4px}
.inner{max-width:920px;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--plum2);font-weight:800}
.toggles{display:flex;gap:6px}
.toggles button{background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.95);border-radius:999px;padding:4px 11px;font-size:.76rem;font-weight:700;color:var(--plum2);box-shadow:0 2px 8px rgba(120,80,140,.08)}
.toggles button[aria-pressed=true]{background:var(--lav2);border-color:#cdb8f2;color:var(--plum)}
.hero h1{margin:10px 0 2px;font:700 clamp(2rem,6.5vw,2.9rem)/1.1 var(--f-head);color:var(--plum)}
.shimmer-text{background:linear-gradient(100deg,#a8578a 0%,#d98aa9 30%,#e9b949 45%,#fff3c4 50%,#e9b949 55%,#b892ec 75%,#7a4fa8 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 7s ease-in-out infinite}
@keyframes shimmer{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.greet{margin:0 0 14px;color:var(--soft);font-size:.98rem}
nav.tabs{display:flex;gap:6px;padding:5px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.9);border-radius:999px;width:max-content;max-width:100%;overflow-x:auto;box-shadow:0 4px 16px rgba(120,80,140,.1)}
nav.tabs button{flex:none;border:0;background:transparent;color:var(--plum2);padding:8px 16px;border-radius:999px;font-weight:800;font-size:.92rem;transition:background .2s,color .2s}
nav.tabs button[aria-selected=true]{background:linear-gradient(120deg,#fbd3e2,#e3d4ff);color:var(--plum);box-shadow:0 3px 10px rgba(180,120,200,.25)}
@media (max-width:520px){nav.tabs{width:100%}nav.tabs button{flex:1 1 auto;padding:8px 10px;font-size:.86rem}nav.tabs .n{margin-left:4px}}
nav.tabs .n{display:inline-block;margin-left:6px;font-size:.72rem;background:rgba(255,255,255,.8);border-radius:999px;padding:0 7px;color:var(--plum2)}
main{max-width:920px;margin:0 auto;padding:10px 14px 30px}
.panel h2{margin:0;font:700 1.35rem/1.25 var(--f-head);color:var(--plum)}
.sub{color:var(--soft);margin:4px 0 0;font-size:.94rem}
.card{background:var(--card);border:1px solid rgba(255,255,255,.95);border-radius:22px;padding:18px;margin:14px 0;box-shadow:var(--shadow)}
.panel{animation:panelIn .45s ease-out}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}}

/* vine progress */
.vinewrap{margin:12px 0 2px}
.vine{width:100%;height:auto;max-height:78px;display:block;overflow:visible}
.vine .track{fill:none;stroke:rgba(95,158,128,.18);stroke-width:5;stroke-linecap:round;stroke-dasharray:1 9}
.vine .grow{fill:none;stroke:url(#vineGrad);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.3,.8,.3,1)}
.vine .leaf{transition:opacity .6s,transform .6s;transform-box:fill-box;transform-origin:center}
.vine .leaf.off{opacity:0;transform:scale(.2)}
.vine .bud{transition:transform 1s cubic-bezier(.3,.8,.3,1)}
.vine .bloom{transform-box:fill-box;transform-origin:center;transition:transform .8s cubic-bezier(.3,1.6,.4,1),opacity .5s}
.vine .bloom.off{transform:scale(0);opacity:0}
.vinelbl{font-size:.9rem;color:var(--soft);margin-top:0;font-weight:700}
.minivine{height:8px;border-radius:99px;background:rgba(95,158,128,.14);overflow:hidden;margin-top:10px}
.minivine i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#9fdcbf,#f7a8c4,#cdb8f2);transition:width .8s}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin:14px 0 0}
.strip div{border-radius:16px;padding:9px 12px;background:var(--c,var(--blush2))}
.strip div:nth-child(1){--c:linear-gradient(135deg,#ffe3ec,#fff3f7)}
.strip div:nth-child(2){--c:linear-gradient(135deg,#ffe7d6,#fff5ec)}
.strip div:nth-child(3){--c:linear-gradient(135deg,#e2f6ec,#f2fbf6)}
.strip div:nth-child(4){--c:linear-gradient(135deg,#ece3ff,#f6f1ff)}
.strip div:nth-child(5){--c:linear-gradient(135deg,#fff3c4,#fffaeb)}
.strip b{display:block;font:700 1.5rem/1.15 var(--f-head);color:var(--plum)}
.strip span{font-size:.78rem;color:var(--soft);font-weight:700}
.srcline{font-size:.83rem;color:var(--soft);margin-top:12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tools button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:.84rem;font-weight:700;color:var(--plum2)}
.tools button:hover{background:var(--lav2)}

.xcheck{background:linear-gradient(135deg,rgba(226,246,236,.92),rgba(255,252,247,.9));position:relative;overflow:hidden}
.xcheck::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:4px;background:linear-gradient(#9fdcbf,#cdb8f2)}
.xcheck h3{margin:0 0 4px;font:700 1.02rem var(--f-head);color:var(--plum)}
.xcheck ul{margin:6px 0 0;padding-left:18px}
.xcheck .empty{color:var(--soft);font-size:.92rem;margin:0}

.sechead{display:flex;align-items:center;gap:10px;margin:26px 4px 2px}
.sechead h2{font-size:1.25rem}
.blossom{position:relative;flex:none;width:30px;height:30px;border-radius:50%;background:var(--pc,#f7c8d8)}
.blossom::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#ffe7a3 0 22%,transparent 24%),conic-gradient(from 0deg,var(--pc) 0 20%,var(--pc2) 20% 40%,var(--pc) 40% 60%,var(--pc2) 60% 80%,var(--pc) 80%);-webkit-mask:radial-gradient(circle,#000 62%,transparent 64%);mask:radial-gradient(circle,#000 62%,transparent 64%)}
.blossom{--pc2:#fff;box-shadow:0 3px 8px rgba(180,110,170,.25)}
.pill{font-size:.75rem;background:rgba(255,255,255,.85);color:var(--plum2);border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-weight:800;white-space:nowrap}
.note{color:var(--soft);font-size:.88rem;margin:2px 4px 6px}

ul.tasks{list-style:none;margin:0;padding:0}
li.task{position:relative;display:flex;gap:12px;padding:11px 6px;border-top:1px dashed rgba(126,96,160,.18);border-radius:12px;transition:background .2s}
li.task:first-child{border-top:0}
li.task:hover{background:rgba(255,227,236,.35)}
li.task .body{flex:1;min-width:0}
li.task .what{font-weight:700}
li.task .who{display:block;font-size:.85rem;color:var(--soft)}
li.task.done .what{text-decoration:line-through;text-decoration-color:rgba(224,120,159,.6);color:#9a89ab}
li.task.done{background:rgba(226,246,236,.45)}
/* custom checkbox */
.cb{flex:none;position:relative;width:24px;height:24px;margin-top:0}
.cb input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer;width:100%;height:100%}
.cb span{position:absolute;inset:0;border-radius:9px;border:2px solid #d6b8e8;background:#fff;transition:all .2s;pointer-events:none}
.cb span::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);transition:transform .25s cubic-bezier(.3,1.8,.4,1)}
.cb input:checked+span{background:linear-gradient(135deg,#f29bbd,#b892ec);border-color:transparent;box-shadow:0 0 0 3px rgba(255,231,163,.6)}
.cb input:checked+span::after{transform:rotate(45deg) scale(1)}
.cb input:focus-visible+span{outline:3px solid rgba(160,110,220,.55);outline-offset:2px}
.cb:hover span{border-color:#b892ec}
/* leaving / shimmer */
li.task.leaving{overflow:hidden;transition:max-height .55s ease .25s,padding .55s ease .25s,opacity .5s ease .3s,transform .6s ease .2s;opacity:0;transform:scale(.96);padding-top:0;padding-bottom:0}
li.task.shine::after{content:"";position:absolute;inset:0;border-radius:12px;pointer-events:none;background:linear-gradient(110deg,transparent 20%,rgba(255,243,196,.85) 45%,rgba(255,200,225,.7) 55%,transparent 80%);background-size:250% 100%;animation:shine .8s ease-out forwards}
@keyframes shine{from{background-position:120% 0}to{background-position:-60% 0}}
li.task.pop{animation:pop .5s cubic-bezier(.3,1.6,.4,1)}
@keyframes pop{40%{transform:scale(1.025)}}
details{margin-top:4px}
summary{font-size:.82rem;color:#8a4fc7;cursor:pointer;font-weight:700;width:max-content}
.ctx{font-size:.9rem;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:.75rem;border-radius:999px;padding:1px 9px;background:var(--lav2);color:var(--plum2);font-weight:700}
.chip.proj{background:var(--mint2);color:#2f6b52}
.chip.high{background:#ffe0ea;color:#a4305d}
.chip.medium{background:#fff1cf;color:#86600a}
.chip.low{background:#e2f6ec;color:#2f6b52}
.chip.due{background:#ffe7d6;color:#8a4a22}
.srcs{margin-top:7px;display:flex;flex-direction:column;gap:3px}
.srcs a,.srcs span{font-size:.8rem;word-break:break-word}
.srcs q{display:block;color:var(--soft);font-size:.8rem;font-style:italic;margin:1px 0 4px 10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.pgrid .card{margin:0}
.pcard h3{margin:0;font:700 1.14rem/1.3 var(--f-head);display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--plum)}
.badge{font:800 .66rem var(--f-body);letter-spacing:.07em;text-transform:uppercase;border-radius:999px;padding:3px 9px}
.badge.ok{background:var(--mint2);color:#2f6b52}
.badge.maybe{background:#fff1cf;color:#86600a}
.badge.s5{background:var(--lav2);color:#5a3a8a}
.why{font-size:.9rem;color:var(--soft);margin:8px 0 4px}
.og h4{display:inline-block;margin:14px 0 2px;font:800 .74rem var(--f-body);letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--oc,#f3ecff);color:var(--ot,#5a3a8a)}
.og h4 span{text-transform:none;letter-spacing:0;font-weight:600;margin-left:6px;opacity:.85}
.o-Rachel{--oc:#ffe0ea;--ot:#a4305d}.o-Curtis{--oc:#e2f6ec;--ot:#2f6b52}.o-Gabriel{--oc:#ece3ff;--ot:#5a3a8a}.o-Adriana{--oc:#ffe7d6;--ot:#8a4a22}.o-Ben{--oc:#ddeeff;--ot:#2c5a8a}.o-PMs{--oc:#fff1cf;--ot:#86600a}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:14px}
.lanes div{border-radius:16px;padding:8px 12px;font-size:.8rem;background:var(--oc);color:var(--ot)}
.lanes b{display:block;font:700 1rem var(--f-head)}
.pcard.complete{box-shadow:0 0 0 2px rgba(255,215,106,.7),var(--shadow)}
body.hide-done li.task.done{display:none}
.wip-btn{flex:none;align-self:flex-start;display:inline-flex;align-items:center;gap:5px;min-height:32px;padding:4px 11px;border-radius:999px;border:1.5px dashed #d6b8e8;background:rgba(255,255,255,.85);color:#8a74a3;font-size:.74rem;font-weight:800;white-space:nowrap;transition:background .25s,border-color .25s,color .25s,box-shadow .25s}
.wip-btn:hover{border-color:#b892ec;color:#6a4a92}
.wip-btn .sprout{opacity:.45;transition:transform .4s cubic-bezier(.3,1.8,.4,1),opacity .3s;transform-origin:50% 100%}
.wip-btn[aria-pressed=true]{border:1.5px solid transparent;background:linear-gradient(120deg,#ece3ff,#fff1cf);color:#5a3a8a;box-shadow:0 0 0 1px rgba(201,166,245,.6),0 3px 10px rgba(201,166,245,.35)}
.wip-btn[aria-pressed=true] .sprout{opacity:1;transform:scale(1.15)}
li.task.wip{background:linear-gradient(90deg,rgba(236,227,255,.75),rgba(255,247,220,.45));box-shadow:inset 4px 0 0 #c9a6f5;animation:wipglow 3.2s ease-in-out infinite}
@keyframes wipglow{0%,100%{box-shadow:inset 4px 0 0 #c9a6f5,0 0 0 rgba(233,185,73,0)}50%{box-shadow:inset 4px 0 0 #e9b949,0 0 14px rgba(205,184,242,.55)}}
body.calm li.task.wip{animation:none}

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var PREF="isp-todo-prefs";
function load(k){try{return JSON.parse(localStorage.getItem(k)||"{}")||{}}catch(e){return {}}}
function store(k,v){var old=(typeof Sync!=="undefined"&&Sync&&SYNC_KEYS.indexOf(k)>=0)?load(k):null;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}if(old)Sync.changed(k,old,v)}
function pref(k,v){var p=load(PREF);if(arguments.length<2)return p[k];p[k]=v;store(PREF,p)}
var RM=window.matchMedia?window.matchMedia("(prefers-reduced-motion: reduce)"):{matches:false};
function reduced(){return RM.matches}
function calm(){return document.body.classList.contains("calm")}
function rnd(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
var SVGNS="http://www.w3.org/2000/svg";

/* ---------- cross device sync of checkmarks (see SYNC.md) ---------- */
/* localStorage stays the offline cache. Every change to a synced key is stamped per item in SMETA.
   Remote doc (AES-GCM encrypted with a key derived from the page password): {v:1,s:{lsKey:{id:[value|null,ts]}}}.
   Merge = last write wins per item by ts; on a tie a checked value beats an unchecked one beats a deletion,
   so pre-sync ticks (ts 0) are a union and a stale device can never wipe them. null = unticked (tombstone). */
var SYNC_KEYS=["isp-todo-daily-ticks","isp-todo-daily-wip","isp-todo-mkt-ticks","isp-todo-mkt-wip","isp-todo-s4-ticks","isp-todo-dave-ticks","isp-todo-dave-wip","isp-todo-brief-ticks","isp-todo-ship-ticks"];
var SMETA="isp-todo-sync-meta",SYNC_HOOKS=[],TOMB_DAYS=180;
var Sync=(function(){
 var cfg=null,ck=null,busy=false,again=false,pushT=0,lastOk=0,state="off",lastErr="";
 function meta(){var m=load(SMETA);m.t=m.t||{};m.mig=m.mig||{};return m}
 function canon(o){if(o===null||typeof o!=="object")return JSON.stringify(o);if(Array.isArray(o))return "["+o.map(canon).join(",")+"]";return "{"+Object.keys(o).sort().map(function(k){return JSON.stringify(k)+":"+canon(o[k])}).join(",")+"}"}
 function rank(v){return v===null||v===undefined?0:(v===0||v===false||v==="")?1:2}
 function win(a,b){if(!a)return b;if(!b)return a;if(a[1]!==b[1])return a[1]>b[1]?a:b;var ra=rank(a[0]),rb=rank(b[0]);if(ra!==rb)return ra>rb?a:b;return canon(a[0])>=canon(b[0])?a:b}
 function legacyTs(v){return typeof v==="number"&&v>1e12&&v<Date.now()+864e5?v:0}
 function migrate(){var m=meta(),ch=false;SYNC_KEYS.forEach(function(k){if(m.mig[k])return;var v=load(k),t=m.t[k]=m.t[k]||{};Object.keys(v).forEach(function(id){if(!(id in t))t[id]=legacyTs(v[id])});m.mig[k]=Date.now();ch=true});if(ch)store(SMETA,m)}
 function changed(k,o,n){
  var m=meta(),t=m.t[k]=m.t[k]||{},now=Date.now(),any=false;
  Object.keys(o).concat(Object.keys(n)).forEach(function(id){var a=o.hasOwnProperty(id)?canon(o[id]):"~",b=n.hasOwnProperty(id)?canon(n[id]):"~";if(a===b)return;t[id]=Math.max(now,(t[id]||0)+1);any=true});
  if(any){store(SMETA,m);schedule(400)}
 }
 function localDoc(){var m=meta(),s={};SYNC_KEYS.forEach(function(k){var v=load(k),t=m.t[k]||{},o=s[k]={};Object.keys(v).forEach(function(id){o[id]=[v[id],t[id]||0]});Object.keys(t).forEach(function(id){if(!v.hasOwnProperty(id))o[id]=[null,t[id]]})});return {v:1,s:s}}
 function mergeDocs(a,b){var out={v:1,s:{}},cut=Date.now()-TOMB_DAYS*864e5;SYNC_KEYS.forEach(function(k){var x=(a.s||{})[k]||{},y=(b.s||{})[k]||{},o=out.s[k]={};Object.keys(x).concat(Object.keys(y)).forEach(function(id){if(o[id])return;var w=win(x[id],y[id]);if(w[0]===null&&w[1]<cut)return;o[id]=[w[0],w[1]]})});Object.keys(b.s||{}).forEach(function(k){if(!out.s.hasOwnProperty(k))out.s[k]=b.s[k]});return out}
 function applyLocal(doc){var m=meta(),ui=false;SYNC_KEYS.forEach(function(k){var o=doc.s[k]||{},v={},t={};Object.keys(o).forEach(function(id){t[id]=o[id][1];if(o[id][0]!==null)v[id]=o[id][0]});if(canon(v)!==canon(load(k))){ui=true;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}m.t[k]=t});store(SMETA,m);return ui}
 function key(){if(ck)return ck;ck=crypto.subtle.importKey("raw",b64d(cfg.k),{name:"AES-GCM"},false,["encrypt","decrypt"]);return ck}
 function url(){return cfg.u.replace(/\/$/,"")+"/"+cfg.id}
 function pull(){
  return fetch(url()+"?_="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("read "+r.status);return r.text()}).then(function(txt){
   txt=(txt||"").trim();if(!txt)return {v:1,s:{}};var e;try{e=JSON.parse(txt)}catch(x){return {v:1,s:{},bad:1}}
   if(!e||!e.iv||!e.ct)return {v:1,s:{},bad:1};
   return key().then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(e.iv)},k,b64d(e.ct))}).then(function(pt){var d=JSON.parse(new TextDecoder().decode(pt));d.s=d.s||{};return d},function(){return {v:1,s:{},bad:1}});
  });

 function push(doc){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  return key().then(function(k){return crypto.subtle.encrypt({name:"AES-GCM",iv:iv},k,new TextEncoder().encode(JSON.stringify(doc)))}).then(function(ct){
   var body=new URLSearchParams();body.set("key",cfg.id);body.set("value",JSON.stringify({v:1,iv:b64e(iv),ct:b64e(ct),at:Date.now()}));
   return fetch(cfg.u.replace(/\/$/,"")+"/update",{method:"POST",body:body,cache:"no-store"});
  }).then(function(r){if(!r.ok)throw new Error("write "+r.status);return r.json()}).then(function(j){if(!j||j.status!==1)throw new Error("write refused")});
 }
 function run(){
  if(!cfg)return Promise.resolve();
  if(busy){again=true;return Promise.resolve()}
  busy=true;again=false;setStatus("syncing");
  var remote;
  return pull().then(function(r){remote=r;var merged=mergeDocs(localDoc(),remote);var ui=applyLocal(merged);if(ui)SYNC_HOOKS.forEach(function(f){try{f()}catch(e){}});
   var base=remote.bad?null:canon(mergeDocs({v:1,s:{}},remote));return base===canon(merged)?null:push(merged)})
  .then(function(){lastOk=Date.now();lastErr="";setStatus("ok")},function(e){lastErr=String(e&&e.message||e);setStatus(navigator.onLine===false?"offline":"error")})
  .then(function(){busy=false;if(again)schedule(200)});

 function setStatus(s){state=s;var el=document.getElementById("syncState");if(!el)return;
  el.textContent=s==="ok"?"Checkmarks sync across your devices. Last synced "+new Date(lastOk).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})+".":
   s==="syncing"?(lastOk?el.textContent:"Syncing checkmarks..."):
   s==="offline"?"Offline right now. Checkmarks are saved on this device and will sync when you are back online.":
   s==="error"?"Could not reach the sync service. Checkmarks are saved on this device and will sync on the next try.":"Checkmarks are saved on this device.";
  el.setAttribute("data-state",s)}
 function start(c){
  if(!c||!c.u||!c.id||!c.k||!window.fetch||!window.crypto||!crypto.subtle){setStatus("off");return}
  cfg=c;migrate();run();
  setInterval(function(){if(!document.hidden)run()},60000);
  window.addEventListener("focus",function(){schedule(150)});
  document.addEventListener("visibilitychange",function(){if(!document.hidden)schedule(150)});
  window.addEventListener("online",function(){schedule(150)});
  window.addEventListener("storage",function(e){if(SYNC_KEYS.indexOf(e.key)>=0)SYNC_HOOKS.forEach(function(f){try{f()}catch(x){}})});

 return {start:start,changed:changed,refresh:function(){setStatus(state)}};
})();

/* ---------- greeting ---------- */
function etHour(){try{return parseInt(new Date().toLocaleString("en-US",{timeZone:"America/New_York",hour:"numeric",hour12:false}),10)%24}catch(e){return new Date().getHours()}}
function hello(){var h=etHour();return h<5?"Hello":h<12?"Good morning":h<17?"Good afternoon":"Good evening"}
$("#hello").textContent=hello()+", Rachel";

/* ---------- calm mode + pause when hidden ---------- */
if(pref("calm"))document.body.classList.add("calm");
document.addEventListener("visibilitychange",function(){document.body.classList.toggle("paused",document.hidden)});

/* ---------- garden ---------- */
(function garden(){

 function isDone(t){if(t.src==="daily")return !!dt[t.id];if(t.src==="marketing")return mt.hasOwnProperty(t.id)?mt[t.id]===1:!!t.done;return !!st[t.id]}
 function find(id){for(var i=0;i<C.length;i++){var T=C[i].todos||[];for(var j=0;j<T.length;j++)if(T[j].id===id)return T[j]}return null}
 var today=etDate();
 function dueChip(d){if(!d)return "";var late=d<today;var x=new Date(d+"T12:00:00");var lab=isNaN(x)?d:x.toLocaleDateString("en-US",{month:"short",day:"numeric"});return '<span class="chip '+(late?'late':'due')+'">'+(late?'Overdue, was due ':'Due ')+esc(lab)+'</span>'}
 function tdHtml(t){var on=isDone(t);return '<li class="sh-td'+(on?' done':'')+'" data-td="'+esc(t.id)+'">'+cbx(on,on?"Mark not done":"Mark done")+'<div class="st"><span class="t">'+esc(t.text)+'</span><div class="meta">'+dueChip(on?"":t.due)+(t.flag?'<span class="chip flag">'+esc(t.flag)+'</span>':'')+'<span class="chip src">'+esc(SRCN[t.src]||t.src)+'</span>'+(on?'<span class="chip okc">Done</span>':'')+'</div></div></li>'}
 function prog(c){if(c.stage==null)return "";var i=ST.indexOf(c.stage),pct=Math.round((i+1)/ST.length*100);
  return '<div class="sh-prog" role="img" aria-label="'+esc(c.stage)+', '+pct+' percent"><div class="sh-bar"><i style="width:'+pct+'%"></i></div><div class="sh-steps">'+ST.map(function(s,k){return '<span class="'+(k===i?'cur':k<i?'on':'')+'">'+esc(s)+'</span>'}).join("")+'</div></div>'}
 function draw(){
  clearTimeout(drawT);reload();
  var openT=0,late=0,flags=0;C.forEach(function(c){(c.todos||[]).forEach(function(t){if(!isDone(t)){openT++;if(t.due&&t.due<today)late++}});flags+=(c.flags||[]).length});
  var h='<div class="card"><h2>Shipping</h2><p class="sub">Every shipment I am coordinating, where it stands, and what I need to do next. Boxes linked to my Daily To Do are the same to dos, so checking one here checks it there too.</p>'+
   '<div class="strip"><div><b>'+C.length+'</b><span>Shipments</span></div><div><b>'+openT+'</b><span>Open to dos</span></div><div><b>'+late+'</b><span>Overdue</span></div><div><b>'+flags+'</b><span>Flags</span></div></div>'+
   ((m.notes||[]).length?'<ul class="pj-notes">'+m.notes.map(function(n){return '<li>'+esc(n)+'</li>'}).join("")+'</ul>':'')+
   '<div class="srcline">'+(m.updated_at?'Updated '+fmtDate(m.updated_at)+'. ':'')+'Checked: '+esc(m.sources_checked||"")+'</div>'+
   '<div class="tools"><button type="button" class="hideBtn"></button></div></div>';
  C.forEach(function(c){
   var T=(c.todos||[]).slice().sort(function(a,b){return (isDone(a)?1:0)-(isDone(b)?1:0)}),open=T.filter(function(t){return !isDone(t)}).length,W=c.waiting||[];
   h+='<div class="card pjcard sh-card" id="sh-'+esc(c.id)+'"><div class="sh-top"><h3>'+esc(c.title)+'</h3>'+(c.refs||[]).map(function(r){return '<span class="sh-ref">'+esc(r)+'</span>'}).join("")+'</div>'+
    '<div class="chips" style="margin-top:6px"><span class="chip proj">'+esc(c.project)+'</span>'+(c.stage!=null?'<span class="chip">'+esc(c.stage)+'</span>':'')+(c.flags||[]).map(function(f){return '<span class="chip flag">'+esc(f)+'</span>'}).join("")+'</div>'+
    prog(c)+
    ((c.route||c.mode)?'<div class="sh-line">'+(c.route?'<b>Route:</b> '+esc(c.route)+'. ':'')+(c.mode?'<b>Mode:</b> '+esc(c.mode)+'.':'')+'</div>':'')+
    (c.partner?'<div class="sh-line"><b>Forwarder:</b> '+esc(c.partner)+'</div>':'')+
    ((c.dates||[]).length?'<div class="sh-line">'+c.dates.map(function(d){return '<b>'+esc(d.label)+':</b> '+esc(d.value)}).join(". ")+'</div>':'')+
    '<div class="pjsec st sh-sum"><h4>Where it stands</h4>'+(c.summary||[]).map(function(p){return '<p>'+esc(p)+'</p>'}).join("")+'</div>'+
    '<div class="pjsec td"><h4>Shipping to dos<span>'+open+' open</span></h4>'+(T.length?'<ul class="sh-todos">'+T.map(tdHtml).join("")+'</ul>':'<p class="note" style="margin-left:0">Nothing open.</p>')+'</div>'+
    (W.length?'<div class="pjsec wt"><h4>Waiting on</h4><ul class="plain">'+W.map(function(w){return '<li><span class="t">'+esc(w.text)+'</span><div class="meta">'+(w.who?'<span class="chip wait">'+esc(w.who)+'</span>':'')+(w.since?'<span class="chip">'+esc(w.since)+'</span>':'')+'</div></li>'}).join("")+'</ul></div>':'')+
    ((c.sources||[]).length?'<details class="pjsrc"><summary>Sources</summary>'+c.sources.map(function(s){var u=safeUrl(s.url);return u?'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(s.label)+'</a>':'<span>'+esc(s.label)+'</span>'}).join("")+'</details>':'')+
    '</div>';
  });
  var P=S.partners||[];
  if(P.length)h+='<div class="card"><details><summary><b>Shipping partners and contacts</b></summary><table class="sh-partners">'+P.map(function(p){return '<tr><td>'+esc(p.company)+'</td><td>'+esc(p.person)+'</td><td>'+(p.email?'<a href="mailto:'+esc(p.email)+'">'+esc(p.email)+'</a>':'')+'</td><td>'+esc(p.role)+'</td></tr>'}).join("")+'</table></details></div>';
  el.innerHTML=h;$("#nShip").textContent=openT||"";setHide(hideDone);
 }
 function others(){SYNC_HOOKS.forEach(function(f){if(f!==hook)try{f()}catch(e){}})}
 el.addEventListener("change",function(e){
  var li=e.target.closest("li.sh-td");if(!li)return;var id=li.getAttribute("data-td"),t=find(id),on=e.target.checked;if(!t)return;reload();
  if(t.src==="daily"){if(on){dt[id]=Date.now();store(DKEY,dt);var w=load(WKEY);if(w[id]){delete w[id];store(WKEY,w)}}else{delete dt[id];store(DKEY,dt)}}
  else if(t.src==="marketing"){mt[id]=on?1:0;store(MKEY,mt);if(on){var mw=load(MWKEY);if(mw[id]){delete mw[id];store(MWKEY,mw)}}}
  else{if(on)st[id]=Date.now();else delete st[id];store(SHKEY,st)}
  others();
  if(on){var c=centerOf(e.target);burst(c[0],c[1],"small");chime(false);li.classList.add("shine")}
  drawT=setTimeout(draw,on&&!reduced()?650:0);
 });
 el.addEventListener("click",function(e){if(e.target.classList.contains("hideBtn"))setHide(!hideDone)});
 var hook=function(){draw()};SYNC_HOOKS.push(hook);SHIP_DRAW=draw;
 draw();
}

/* ---------- Standup ---------- */
function renderStandup(S){
 var el=$("#tab-standup");
 if(!S||S.status!=="sent"){el.innerHTML='<div class="card standup"><div class="moon" aria-hidden="true"></div><h2>Weekly Standup</h2><p>Your standup email goes out every Monday at 8 AM ET. After its first run on Monday, Oct 26, a summary of it will show up here.</p></div>';return}
 el.innerHTML='<div class="card standup sent"><h2>Weekly Standup</h2><p class="sub">Sent '+fmtDate(S.sent_at)+(S.subject?', "'+esc(S.subject)+'"':'')+'</p>'+(S.summary||[]).map(function(x){return '<p>'+esc(x)+'</p>'}).join("")+'</div>';
}

/* ---------- Projects (meeting prep) ---------- */
function etDate(ts){var d=ts?new Date(ts):new Date();return d.toLocaleDateString("en-CA",{timeZone:"America/New_York"})}
function etTime(iso,ampm){var d=new Date(iso);if(isNaN(d))return "";var s=d.toLocaleTimeString("en-US",{timeZone:"America/New_York",hour:"numeric",minute:"2-digit"});return ampm?s:s.replace(/\s?[AP]M$/,"")}
var PJ=null;
function renderProjects(D){
 if(D)PJ=D;D=PJ||{cards:[]};var el=$("#tab-projects"),C=D.cards||[];
 var dt=load(DKEY),mt=load(MKEY),vt=load(VKEY);
 function isDone(x){if(!x)return false;if(x.src==="daily")return !!dt[x.id];if(x.src==="marketing")return mt.hasOwnProperty(x.id)?mt[x.id]===1:!!x.done;if(x.src==="dave")return !!vt[x.id];return !!x.done}
 var SRC={daily:"Daily",marketing:"Marketing",dave:"Talk with Dave"};
 var today=etDate(),now=Date.now(),isToday=D.date===today,nowId=null;
 if(isToday){for(var i=0;i<C.length;i++){if(new Date(C[i].end).getTime()>now){nowId=C[i].id;break}}}
 var openT=0,waitN=0;C.forEach(function(c){openT+=(c.todos||[]).filter(function(t){return !isDone(t)}).length;waitN+=(c.waiting||[]).filter(function(w){return !isDone(w.ref)}).length});
 var when=D.date?(D.date===today?"today":(D.date>today?"an upcoming day":"a past day")):"";
 var h='<div class="card pj-hero"><h2>Projects</h2><p class="sub">Meeting prep for '+esc(D.date_label||D.date||"")+(when?' ('+when+')':'')+'. One card per project meeting in time order, with where it stands, your open to dos, what you are waiting on, and a suggested agenda.</p>'+
  '<div class="strip"><div><b>'+C.length+'</b><span>Meetings</span></div><div><b>'+openT+'</b><span>Open to dos</span></div><div><b>'+waitN+'</b><span>Waiting on others</span></div></div>'+
  ((D.notes||[]).length?'<ul class="pj-notes">'+D.notes.map(function(n){return '<li>'+esc(n)+'</li>'}).join("")+'</ul>':'')+
  (C.length?'<div class="pj-jump">'+C.map(function(c){return '<button type="button" data-jump="'+esc(c.id)+'"><b>'+esc(etTime(c.start,true))+'</b>'+esc(c.project||c.title)+'</button>'}).join("")+'</div>':'')+
  '<div class="srcline">Checked: '+esc(D.sources_checked||"")+(D.generated_at?' Updated '+fmtDate(D.generated_at)+'.':'')+((D.skipped||[]).length?' Skipped (not project meetings): '+esc(D.skipped.map(function(s){return typeof s==="string"?s:s.title}).join(", "))+'.':'')+'</div></div>';
 if(!C.length)h+='<div class="card"><p class="note">No project meetings on the calendar for this day.</p></div>';
 C.forEach(function(c){
  var T=(c.todos||[]).slice().sort(function(a,b){return (isDone(a)?1:0)-(isDone(b)?1:0)}),open=T.filter(function(t){return !isDone(t)}).length;
  function tdHtml(t){var d=isDone(t);return '<li class="'+(d?'done':'')+'"><span class="t">'+esc(t.text)+'</span><div class="meta"><span class="chip src">'+esc(SRC[t.src]||t.src||"")+'</span><span class="chip">Owner: '+esc(t.owner||"")+'</span>'+(t.due?'<span class="chip due">Due '+esc(t.due)+'</span>':'')+(d?'<span class="chip okc">Done</span>':'')+'</div></li>'}
  var first=T.slice(0,6),rest=T.slice(6);
  var W=c.waiting||[];
  h+='<div class="card pjcard'+(c.id===nowId?' now':'')+'" id="pj-'+esc(c.id)+'"><div class="pjhead"><div class="pjtime">'+esc(etTime(c.start))+'<span>to '+esc(etTime(c.end,true))+' ET</span></div><div><h3>'+esc(c.title)+'</h3>'+
   '<div class="chips"><span class="chip proj">'+esc(c.project||"")+'</span>'+(c.id===nowId?'<span class="chip wait">Up next</span>':'')+(c.flags||[]).map(function(f){return '<span class="chip flag">'+esc(f)+'</span>'}).join("")+'</div>'+
   '<div class="pjwho">With '+esc((c.attendees||[]).join(", "))+(c.organizer&&c.organizer!=="Rachel Hejduk"?'. Organizer: '+esc(c.organizer):'')+(safeUrl(c.calendar_url)?'. <a href="'+esc(c.calendar_url)+'" target="_blank" rel="noopener">Calendar</a>':'')+'</div></div></div>'+
   (c.note?'<div class="pjnote">'+esc(c.note)+'</div>':'')+
   '<div class="pjsec st"><h4>Status</h4>'+(c.status||[]).map(function(p){return '<p>'+esc(p)+'</p>'}).join("")+'</div>'+
   '<div class="pjsec td"><h4>Open to dos<span>'+open+' open</span></h4>'+(T.length?'<ul class="plain">'+first.map(tdHtml).join("")+'</ul>'+(rest.length?'<details><summary>'+rest.length+' more</summary><ul class="plain">'+rest.map(tdHtml).join("")+'</ul></details>':''):'<p class="note" style="margin-left:0">Nothing on your lists for this one.</p>')+'</div>'+
   '<div class="pjsec wt"><h4>Outstanding and waiting on</h4>'+(W.length?'<ul class="plain">'+W.map(function(w){var d=isDone(w.ref),u=safeUrl(w.link);return '<li class="'+(d?'done':'')+'"><span class="t">'+esc(w.text)+'</span>'+(u?' <a class="go" href="'+esc(u)+'" target="_blank" rel="noopener">Open</a>':'')+'<div class="meta">'+(w.who?'<span class="chip wait">'+esc(w.who)+'</span>':'')+(w.ref?'<span class="chip src">'+esc(SRC[w.ref.src]||"")+'</span>':'')+(d?'<span class="chip okc">Settled</span>':'')+'</div></li>'}).join("")+'</ul>':'<p class="note" style="margin-left:0">Nothing outstanding found.</p>')+'</div>'+
   '<div class="pjsec ag"><h4>Suggested agenda</h4><ol>'+(c.agenda||[]).map(function(a){return '<li>'+esc(a)+'</li>'}).join("")+'</ol></div>'+
   ((c.sources||[]).length?'<details class="pjsrc"><summary>Sources</summary>'+c.sources.map(function(s){var u=safeUrl(s.url);return u?'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(s.label)+'</a>':'<span>'+esc(s.label)+'</span>'}).join("")+'</details>':'')+
   '</div>';
 });
 el.innerHTML=h;$("#nProj").textContent=C.length||"";
}
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-jump]");if(!b)return;var t=document.getElementById("pj-"+b.getAttribute("data-jump"));if(t)t.scrollIntoView({behavior:reduced()?"auto":"smooth",block:"start"})});

function render(data){
 Sync.start(data.sync);SYNC_HOOKS.push(function(){if(PJ)renderProjects()});
 renderDaily(data.daily);renderProjects(data.projects);renderMarketing(data.marketing);renderDave(data.dave);renderBrief(data.brief);renderShipping(data.shipping);renderStandup(data.standup);
 $("#foot").innerHTML="Built "+esc(fmtDate(data.built_at))+". <span id=\"syncState\"></span>";Sync.refresh();
 var tabs=$$("nav.tabs button");
 function show(name){tabs.forEach(function(b){b.setAttribute("aria-selected",b.getAttribute("data-tab")===name?"true":"false")});["daily","projects","marketing","dave","brief","shipping","standup"].forEach(function(n){$("#tab-"+n).classList.toggle("hidden",n!==name)});pref("tab",name);if(name==="projects")renderProjects();if(name==="brief"&&BRIEF_DRAW)BRIEF_DRAW();if(name==="shipping"&&SHIP_DRAW)SHIP_DRAW();
  var k=name==="daily"?"daily":name==="marketing"?"mkt":null;if(k&&vineMem[k]!=null){var v=vineMem[k];vineMem[k]=0;growVine($("#tab-"+name),k,v)}}
 tabs.forEach(function(b){b.addEventListener("click",function(){show(b.getAttribute("data-tab"));history.replaceState(null,"","#"+b.getAttribute("data-tab"))})});
 var h=location.hash.slice(1);var TABS=["daily","projects","marketing","dave","brief","shipping","standup"],pt=pref("tab");show(TABS.indexOf(h)>=0?h:(TABS.indexOf(pt)>=0?pt:"daily"));
}
})();
</script>
